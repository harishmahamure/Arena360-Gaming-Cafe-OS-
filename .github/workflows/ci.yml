name: CI

on:
  pull_request:
  # deploy-cloud.yml runs the whole suite before it builds or promotes an image.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so deploy-cloud's CI run never cancels
  # (or is cancelled by) the push-triggered one on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # gz_control tests (arena-store `control`, arena-cloud) run against a libsql server, and the
    # backup tests (arena-cloud) against MinIO for R2. Service containers only exist on Linux; an
    # empty image skips them on Windows, where those tests skip.
    services:
      sqld:
        image: ${{ matrix.os == 'ubuntu-latest' && 'ghcr.io/tursodatabase/libsql-server:v0.24.31' || '' }}
        ports:
          - 8080:8080
      minio:
        image: ${{ matrix.os == 'ubuntu-latest' && 'bitnamilegacy/minio:2025.7.23-debian-12-r5' || '' }}
        # CI-only credentials (the dev compose ones); each test creates its own bucket.
        env:
          MINIO_ROOT_USER: arena-dev
          MINIO_ROOT_PASSWORD: arena-dev-password
        ports:
          - 9000:9000
    env:
      ARENA_TEST_SQLD_URL: ${{ matrix.os == 'ubuntu-latest' && 'http://127.0.0.1:8080' || '' }}
      ARENA_REQUIRE_SQLD: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      ARENA_TEST_S3_URL: ${{ matrix.os == 'ubuntu-latest' && 'http://127.0.0.1:9000' || '' }}
      ARENA_REQUIRE_S3: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Wait for the libsql server
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          echo "libsql server did not become healthy"; exit 1
      - name: Wait for MinIO
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy"; exit 1
      - name: Install Tauri Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p arena-store --features control --all-targets -- -D warnings
      - run: cargo test --locked -p arena-store --features control
      # arena-cloud must never pull libsql into the Hub, nor a C SQLite core into libsql.
      - name: libsql stays out of the Hub
        shell: bash
        run: |
          # `libsql` crates only; rusqlite's `libsqlite3-sys` is expected.
          if cargo tree --locked -p arena-hub -e normal | grep -Eq ' libsql(-[a-z0-9]+)? v'; then
            echo "arena-hub depends on libsql"; exit 1
          fi
          if cargo tree --locked -p arena-cloud -e normal | grep -E -q 'libsql-(ffi|sys)'; then
            echo "arena-cloud links a libsql C core"; exit 1
          fi
      # Story 2.2: rusqlite's bundled SQLite is the only SQLite C library in arena-cloud.
      - name: One SQLite in arena-cloud
        if: runner.os == 'Linux'
        run: |
          scripts/check-sqlite-linkage.sh --self-test
          scripts/check-sqlite-linkage.sh
      - run: cargo clippy --locked -p arena-hub --features dev-fixtures --all-targets -- -D warnings
      - run: cargo test --locked -p arena-hub --features dev-fixtures
      - run: cargo test --locked -p arena-api --features dev-fixtures
      - run: cargo clippy --locked -p arena-kiosk-svc --features dev-fixtures --all-targets -- -D warnings
      - run: cargo test --locked -p arena-kiosk-svc --features dev-fixtures

  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:generated
      - run: pnpm run format:check
      - run: pnpm run check:layers
      - run: pnpm run check:pins
      - run: pnpm run check:protocol
      - run: pnpm run check:strings
      - run: pnpm run check:tokens-fresh
      - run: pnpm run check:contrast
      - run: pnpm run check:tokens-used
      - run: pnpm run check:hex
      - run: pnpm run check:no-blur
      - run: pnpm run check:ads
      - run: pnpm run check:secrets
      - run: pnpm run check:deploy
      - run: pnpm run test:scripts

  build:
    name: build (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: hub, os: windows-latest }
          - { app: kiosk, os: windows-latest }
          - { app: kitchen, os: ubuntu-latest }
          - { app: owner, os: ubuntu-latest }
          - { app: partner, os: ubuntu-latest }
          - { app: admin, os: ubuntu-latest }
          - { app: onboarding, os: ubuntu-latest }
          - { app: marketing, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        if: matrix.os == 'windows-latest'
      - uses: Swatinem/rust-cache@v2
        if: matrix.os == 'windows-latest'
        with:
          key: tauri-${{ matrix.app }}
      - run: pnpm install --frozen-lockfile
      - if: matrix.app != 'marketing'
        run: pnpm --filter @arena/${{ matrix.app }} check
      - run: pnpm --filter @arena/${{ matrix.app }} build
      - name: Built output renders the Placeholder
        if: matrix.app == 'kitchen' || matrix.app == 'marketing'
        shell: bash
        run: |
          file=apps/kitchen/build/index.html
          if [[ "${{ matrix.app }}" == "marketing" ]]; then file=apps/marketing/dist/index.html; fi
          grep -q "Arena 360" "$file" || { echo "\"Arena 360\" not found in $file"; exit 1; }
      - name: Built output loads nothing remotely
        if: matrix.app == 'hub' || matrix.app == 'kiosk' || matrix.app == 'kitchen'
        run: pnpm run check:no-remote ${{ matrix.app }}
      # No ad SDK, ad endpoint or ads plugin in the Hub or Kiosk web build (the Hub's holds only the
      # no-op gate, which names the plugin's bridge) or in the Windows executables.
      - name: Built output has no ad code
        if: matrix.app == 'hub' || matrix.app == 'kiosk'
        shell: bash
        run: |
          if [[ "${{ matrix.app }}" == "hub" ]]; then
            node scripts/check-ads.mjs artefact apps/hub/build --allow=ArenaAds
          else
            node scripts/check-ads.mjs artefact apps/kiosk/build
          fi
      - if: matrix.os == 'windows-latest'
        run: pnpm --filter @arena/${{ matrix.app }} tauri build --no-bundle -- --locked
      - name: Windows executable has no ad code
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          exe=$(node -p "require('./apps/${{ matrix.app }}/src-tauri/tauri.conf.json').mainBinaryName")
          allow=""
          if [[ "${{ matrix.app }}" == "hub" ]]; then allow="--allow=ArenaAds"; fi
          node scripts/check-ads.mjs artefact "target/release/$exe.exe" $allow

  installer:
    name: installer (hub, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked --release -p arena-hub
      # The sidecar Tauri bundles from `externalBin` (gitignored; only this job creates it).
      - name: Stage the arena-hub sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/hub/src-tauri/binaries | Out-Null
          Copy-Item target/release/arena-hub.exe apps/hub/src-tauri/binaries/arena-hub-x86_64-pc-windows-msvc.exe
      - run: pnpm --filter @arena/hub tauri build --config src-tauri/tauri.installer.conf.json --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: hub-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  kiosk-installer:
    name: installer (kiosk, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kiosk-installer
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked --release -p arena-kiosk-svc
      # The service Tauri bundles from `externalBin` (gitignored; only this job creates it).
      - name: Stage the arena-kiosk-svc sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/kiosk/src-tauri/binaries | Out-Null
          Copy-Item target/release/arena-kiosk-svc.exe apps/kiosk/src-tauri/binaries/arena-kiosk-svc-x86_64-pc-windows-msvc.exe
      - run: pnpm --filter @arena/kiosk tauri build --config src-tauri/tauri.installer.conf.json --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (hub)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      SOPS_URL: https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
      SOPS_SHA256: PIN-ME
      UPLOAD_KEY_FILE: deploy/secrets/android-upload.enc.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install the pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-android.mjs manifest
      - run: node scripts/check-ads.mjs source
      - name: Upload key from SOPS
        id: key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [[ ! -f "$UPLOAD_KEY_FILE" ]]; then
            echo "::warning::$UPLOAD_KEY_FILE is missing: the release AAB is built unsigned"
            exit 0
          fi
          if [[ ! "$SOPS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::SOPS_SHA256 is not a sha256. Pin it in ci.yml (deploy/README.md, \"Pin the tool checksums\")."
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/sops" "$SOPS_URL"
          echo "${SOPS_SHA256}  $RUNNER_TEMP/sops" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/sops" "$RUNNER_TEMP/sops-bin"
          get() {
            local v
            v=$("$RUNNER_TEMP/sops-bin" --decrypt --extract "[\"$1\"]" "$UPLOAD_KEY_FILE")
            [[ -n "$v" ]] || { echo "::error::$1 is empty in $UPLOAD_KEY_FILE"; exit 1; }
            printf '%s' "$v"
          }
          key_b64=$(get keystore_b64)
          store_password=$(get store_password)
          key_alias=$(get key_alias)
          key_password=$(get key_password)
          printf '%s' "$key_b64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$store_password" "$key_alias" "$key_password" > apps/hub/src-tauri/gen/android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Debug APK
        run: pnpm --filter @arena/hub exec tauri android build --apk --debug --target aarch64 --target x86_64 -- --locked
      - name: Release AAB
        run: pnpm --filter @arena/hub exec tauri android build --aab --target aarch64 --target x86_64 -- --locked
      - name: Check the ad ids in the debug and release builds
        run: node scripts/check-ads.mjs ids
      - name: Inspect the AAB
        run: |
          aab=$(find apps/hub/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n 1)
          test -n "$aab"
          mkdir "$RUNNER_TEMP/aab"
          unzip -q "$aab" -d "$RUNNER_TEMP/aab"
          node scripts/check-android.mjs aab "$RUNNER_TEMP/aab"
          if [[ "${{ steps.key.outputs.signed }}" == "true" ]]; then
            jarsigner -verify "$aab"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hub-android
          path: |
            apps/hub/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/hub/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  a11y:
    name: a11y (gallery, hub shell, kiosk ui, onboarding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/gallery exec playwright install --with-deps chromium
      - run: pnpm --filter @arena/gallery check
      - run: pnpm --filter @arena/gallery build
      - run: pnpm --filter @arena/gallery test:a11y
      - run: pnpm --filter @arena/hub check
      - run: pnpm --filter @arena/hub build
      - run: pnpm --filter @arena/hub test:shell
      - run: pnpm --filter @arena/kiosk check
      - run: pnpm --filter @arena/kiosk test:ui
      - run: pnpm --filter @arena/onboarding check
      - run: pnpm --filter @arena/onboarding build
      - run: pnpm --filter @arena/onboarding test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            apps/gallery/playwright-report/
            apps/gallery/test-results/
            apps/hub/playwright-report/
            apps/hub/test-results/
            apps/kiosk/playwright-report/
            apps/kiosk/test-results/
            apps/onboarding/playwright-report/
            apps/onboarding/test-results/
          retention-days: 14

  # Story 1.22: every Epic 1 flow inside a network namespace with no route out, under strace
  # (only the connectivity probe may connect outside loopback), compared with the same run on
  # the network; then a 3-minute WAN-down soak. Windows-only enforcement (the real lockdown
  # and process killing) is covered by the Story 1.19 escape suite, not here.
  wan-down:
    name: wan-down (linux namespace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: wan-down
      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/hub exec playwright install --with-deps chromium
      - run: scripts/wan-down/run.sh --soak-hours 0.05
      - name: Upload the WAN-down logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wan-down-logs
          path: |
            target/wan-down/
            apps/hub/test-results/
          retention-days: 14

  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust, checks, build, a11y, installer, kiosk-installer, wan-down]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        shell: bash
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
