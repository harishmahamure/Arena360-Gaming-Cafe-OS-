name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:generated
      - run: pnpm run format:check
      - run: pnpm run check:layers
      - run: pnpm run check:pins
      - run: pnpm run check:protocol
      - run: pnpm run check:strings
      - run: pnpm run check:tokens-fresh
      - run: pnpm run check:contrast
      - run: pnpm run check:tokens-used
      - run: pnpm run check:hex
      - run: pnpm run test:scripts

  build:
    name: build (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: hub, os: windows-latest }
          - { app: kiosk, os: windows-latest }
          - { app: kitchen, os: ubuntu-latest }
          - { app: owner, os: ubuntu-latest }
          - { app: partner, os: ubuntu-latest }
          - { app: admin, os: ubuntu-latest }
          - { app: onboarding, os: ubuntu-latest }
          - { app: marketing, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
        if: matrix.os == 'windows-latest'
      - uses: Swatinem/rust-cache@v2
        if: matrix.os == 'windows-latest'
        with:
          key: tauri-${{ matrix.app }}
      - run: pnpm install --frozen-lockfile
      - if: matrix.app != 'marketing'
        run: pnpm --filter @arena/${{ matrix.app }} check
      - run: pnpm --filter @arena/${{ matrix.app }} build
      - name: Built output renders the Placeholder
        if: matrix.app == 'kitchen' || matrix.app == 'marketing'
        shell: bash
        run: |
          file=apps/kitchen/build/index.html
          if [[ "${{ matrix.app }}" == "marketing" ]]; then file=apps/marketing/dist/index.html; fi
          grep -q "Arena 360" "$file" || { echo "\"Arena 360\" not found in $file"; exit 1; }
      - name: Built output loads nothing remotely
        if: matrix.app == 'hub' || matrix.app == 'kiosk' || matrix.app == 'kitchen'
        run: pnpm run check:no-remote ${{ matrix.app }}
      - if: matrix.os == 'windows-latest'
        run: pnpm --filter @arena/${{ matrix.app }} tauri build --no-bundle -- --locked

  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust, checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        shell: bash
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
