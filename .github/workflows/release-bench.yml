name: Release benchmark

# Idle budgets on the reference hardware (2015 i3 + HDD): arena-hub < 50 MB, Hub UI + WebView2
# < 250 MB; Kiosk service + app + WebView2 < 80 MB; no GPU use. Not part of ci-ok; runs on
# demand and on release tags. `floor-perf` (Story 3.3) fails the run when the 60-device Floor misses
# cold open 1 s, paint 2 s, frame 100 ms, input 100 ms or the 30-minute JS heap (250 MB).
# `floor-load` and `flow-timing` (Story 3.37) fail the run when apply p95 passes 100 ms, a floor
# update 2 s, a start or settle 10 s or a profile creation 15 s.
# `counter-load` and `pos-timing` (Story 5.39) do the same for the counter: sale apply p95 and the
# books after a 10-minute mix, a Hub killed during a sale burst, and a scanned sale and a
# within-threshold shift close under 10 s each.
# `journey-*`, `launcher-logout` and `journey-report` (Story 6.38) time the player journey: the
# Hub's legs over the LAN, the kiosk UI's legs, the kiosk's memory idle on attract and in the
# shell, the 30-minute real-clock Hub outage and 20 sessions of real launcher logins per Windows
# version. The report job merges them (scripts/journey-report.mjs) and fails the release on a
# missed budget or a missing result. The rig and its repository variables are described in
# docs/runbooks/journey-bench.md.
# `kitchen-*` (Story 7.11) time the kitchen flow: Journey 4 and a 5-orders-a-second burst over the
# LAN, the unplugged printer, 500 orders with no route out against the same orders with one, and
# the Kitchen display suite on Chrome on Android and Safari on iPad. `kitchen-report` merges them
# (scripts/kitchen-report.mjs), fails the release on a missed budget or a missing result and
# publishes docs/compat/kitchen-display.md. See docs/runbooks/kitchen-bench.md.
# `remote-*` (Story 8.42) time the owner's remote experience: Today's data age, 200 owner commands,
# the cloud's side of the catch-up after an 8-hour outage, a month of R2 PUTs per branch and a busy
# month's first audit results (arena-cloud), and Today's first render on the reference phone
# (apps/owner). `remote-report` merges them (scripts/remote-report.mjs) and fails the release on a
# missed budget or a missing result. See docs/runbooks/remote-bench.md.
# `restore-drill` (Story 9.27) restores one seeded branch (30 days, a fork, two erased players) from
# a local export and from the cloud backup, checks the late erasure and the promote, scans every
# artefact and the logs for the seeded names, phones and emails, times the export of a 1 GB
# database and merges the results (scripts/restore-drill-report.mjs); any failure or missing result
# fails the job and so the release. See docs/runbooks/restore-drill.md.
# The `soak` input adds the 8-hour WAN-down soak (Story 1.22) and spreads the kitchen soak over 8 h.

on:
  workflow_dispatch:
    inputs:
      soak:
        description: "Also run the 8-hour WAN-down soak (scripts/wan-down/soak.sh)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: release-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: build the Hub installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked --release -p arena-hub
      - name: Stage the arena-hub sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/hub/src-tauri/binaries | Out-Null
          Copy-Item target/release/arena-hub.exe apps/hub/src-tauri/binaries/arena-hub-x86_64-pc-windows-msvc.exe
      - run: pnpm --filter @arena/hub tauri build --config src-tauri/tauri.installer.conf.json --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: hub-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # The seeding tool: a dev-fixtures build, never shipped in the installer.
      - run: cargo build --locked --release -p arena-hub --features dev-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: arena-hub-dev-fixtures
          path: target/release/arena-hub.exe
          if-no-files-found: error

  hub-idle:
    name: hub idle (reference i3)
    needs: installer
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hub-installer
          path: bench/installer
      - uses: actions/download-artifact@v4
        with:
          name: arena-hub-dev-fixtures
          path: bench/dev
      - name: Install the Hub
        shell: pwsh
        run: |
          Get-Process -Name arena-hub-ui, arena-hub -ErrorAction SilentlyContinue | Stop-Process -Force
          $setup = Get-ChildItem bench/installer -Filter *.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
      - name: Seed a dev branch
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "arena-hub-bench"
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          & bench/dev/arena-hub.exe dev seed --data-dir $data
          if ($LASTEXITCODE -ne 0) { throw "dev seed exited $LASTEXITCODE" }
      - name: Idle budgets
        shell: pwsh
        run: |
          $ui = Join-Path $env:LOCALAPPDATA "Arena 360 Hub\arena-hub-ui.exe"
          & scripts/bench/hub-idle.ps1 -UiExe $ui -DataDir (Join-Path $env:RUNNER_TEMP "arena-hub-bench")
          exit $LASTEXITCODE
      - name: Uninstall the Hub
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name arena-hub-ui, arena-hub -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninstall = Join-Path $env:LOCALAPPDATA "Arena 360 Hub\uninstall.exe"
          if (Test-Path $uninstall) {
            $p = Start-Process -FilePath $uninstall -ArgumentList "/S" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
          } else {
            Write-Host "nothing to uninstall ($uninstall not found)"
          }

  floor-perf:
    name: floor view, 60 devices (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 60
    env:
      FLOOR_BENCH_SECONDS: "60"
      FLOOR_BENCH_SOAK_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/hub exec playwright install chromium
      - run: pnpm --filter @arena/hub bench:floor

  floor-load:
    name: floor load, 60 devices (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 45
    env:
      FLOOR_LOAD_SECONDS: "600"
      FLOOR_LOAD_BURST_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: 5/s for 10 min with 50/s bursts, then the kill-during-burst check
        run: cargo test --locked --release -p arena-core --test floor_load -- --skip counter --skip sale_burst --nocapture

  flow-timing:
    name: counter flow timings (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/hub exec playwright install chromium
      - run: pnpm --filter @arena/hub bench:flows
      - name: Profile creation under 15 s
        run: pnpm --filter @arena/hub exec playwright test --project=desktop -g "create a profile in under 15 seconds" players.spec.ts

  counter-load:
    name: counter sale load and sale-burst kill (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 45
    env:
      FLOOR_LOAD_SECONDS: "600"
      FLOOR_LOAD_BURST_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Counter sales at 5/s for 10 min with 50/s bursts, then the kill during a sale burst
        run: cargo test --locked --release -p arena-core --test floor_load counter -- --nocapture
      - name: Sale burst killed, every acknowledged sale, stock move and invoice kept
        run: cargo test --locked --release -p arena-core --test floor_load sale_burst -- --nocapture
      - name: Receipts a crash left queued print once
        run: cargo test --locked --release -p arena-tasks rows_left_queued_by_a_crash

  pos-timing:
    name: scanned sale and shift close timings (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/hub exec playwright install chromium
      - name: Scan, pay cash and settle under 10 s
        run: pnpm --filter @arena/hub exec playwright test --project=desktop -g "scan, pay cash and settle takes well under 10 s" pos.spec.ts
      - name: A close within the threshold under 10 s from the first tap
        run: pnpm --filter @arena/hub exec playwright test --project=desktop -g "takes under 10 seconds from the first tap" shift-close.spec.ts

  kiosk-installer:
    name: build the Kiosk installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kiosk-installer
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked --release -p arena-kiosk-svc
      - name: Stage the arena-kiosk-svc sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/kiosk/src-tauri/binaries | Out-Null
          Copy-Item target/release/arena-kiosk-svc.exe apps/kiosk/src-tauri/binaries/arena-kiosk-svc-x86_64-pc-windows-msvc.exe
      - run: pnpm --filter @arena/kiosk tauri build --config src-tauri/tauri.installer.conf.json --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  kiosk-idle:
    name: kiosk idle (reference i3)
    needs: kiosk-installer
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kiosk-installer
          path: bench/kiosk-installer
      - name: Install the Kiosk
        shell: pwsh
        run: |
          Get-Process -Name arena-kiosk-ui -ErrorAction SilentlyContinue | Stop-Process -Force
          $setup = Get-ChildItem bench/kiosk-installer -Filter *.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
      - name: Idle budgets
        shell: pwsh
        run: |
          $ui = Join-Path $env:ProgramFiles "Arena 360 Kiosk\arena-kiosk-ui.exe"
          & scripts/bench/kiosk-idle.ps1 -UiExe $ui -Phase attract -OutJson (Join-Path $env:RUNNER_TEMP "journey-idle\idle-attract.json")
          exit $LASTEXITCODE
      # The rig starts a session on this PC (a Hub on the LAN starts one for the paired kiosk)
      # and the shell is measured as it is.
      - name: Idle budgets in the shell
        if: ${{ vars.JOURNEY_START_SESSION_CMD != '' }}
        shell: pwsh
        env:
          JOURNEY_START_SESSION_CMD: ${{ vars.JOURNEY_START_SESSION_CMD }}
        run: |
          Invoke-Expression $env:JOURNEY_START_SESSION_CMD
          if ($LASTEXITCODE) { throw "starting the session exited $LASTEXITCODE" }
          Start-Sleep -Seconds 10
          $ui = Join-Path $env:ProgramFiles "Arena 360 Kiosk\arena-kiosk-ui.exe"
          & scripts/bench/kiosk-idle.ps1 -UiExe $ui -Phase shell -OutJson (Join-Path $env:RUNNER_TEMP "journey-idle\idle-shell.json")
          exit $LASTEXITCODE
      - name: Upload the memory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-idle
          path: ${{ runner.temp }}/journey-idle/*.json
          if-no-files-found: ignore
      - name: Uninstall the Kiosk
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name arena-kiosk-ui -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninstall = Join-Path $env:ProgramFiles "Arena 360 Kiosk\uninstall.exe"
          if (Test-Path $uninstall) {
            $p = Start-Process -FilePath $uninstall -ArgumentList "/S" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
          } else {
            Write-Host "nothing to uninstall ($uninstall not found)"
          }

  journey-hub:
    name: journey, the Hub's legs over the LAN (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Login, approval, Extend and an order on the tile against their budgets
        env:
          ARENA_JOURNEY_OUT: ${{ github.workspace }}/target/journey-out/hub.json
        run: cargo test --locked --release -p arena-api --test lan the_hub_side_of_journey_3 -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-hub
          path: target/journey-out/hub.json
          if-no-files-found: ignore

  journey-ui:
    name: journey, the kiosk UI's legs (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/kiosk exec playwright install chromium
      - name: Attract to attract, each leg timed
        env:
          ARENA_JOURNEY_UI_OUT: ${{ github.workspace }}/target/journey-out/ui.json
        run: pnpm --filter @arena/kiosk exec playwright test journey.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-ui
          path: target/journey-out/ui.json
          if-no-files-found: ignore

  journey-hub-down:
    name: journey, the Hub stopped for 30 minutes (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: 30 real minutes without the Hub, then the lock at zero and the Hub's word
        env:
          ARENA_HUBDOWN_OUT: ${{ github.workspace }}/target/journey-out/hub-down.json
        run: cargo test --locked --release -p arena-kiosk-svc --lib a_real_thirty_minute_hub_outage -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-hub-down
          path: target/journey-out/hub-down.json
          if-no-files-found: ignore

  launcher-logout:
    name: launcher logout, 20 sessions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows 10
            label: lab-win10
            file: residue-win10.json
          - os: Windows 11
            label: lab-win11
            file: residue-win11.json
    runs-on: [self-hosted, windows, "${{ matrix.label }}"]
    timeout-minutes: 180
    env:
      LAUNCHER_LOGIN_CMD: ${{ vars.LAUNCHER_LOGIN_CMD }}
      LAUNCHER_END_CMDS: ${{ vars.LAUNCHER_END_CMDS }}
      LAUNCHER_PROFILE: ${{ vars.LAUNCHER_PROFILE }}
      LAUNCHER_STEAM_DIR: ${{ vars.LAUNCHER_STEAM_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # LAUNCHER_LOGIN_CMD signs Steam, Epic, Riot, Discord, Chrome and Edge in with the lab's real
      # accounts; LAUNCHER_END_CMDS is a JSON array of commands, one per way a session ends.
      - name: 20 sessions, each scanned for what the last player left
        shell: pwsh
        run: |
          $ends = $env:LAUNCHER_END_CMDS | ConvertFrom-Json
          if (-not $ends -or -not $env:LAUNCHER_LOGIN_CMD) { throw "LAUNCHER_LOGIN_CMD and LAUNCHER_END_CMDS must be set for the lab" }
          $launch = @("scripts/launcher-residue.mjs", "--os", "${{ matrix.os }}", "--sessions", "20",
            "--profile", $env:LAUNCHER_PROFILE, "--steam", $env:LAUNCHER_STEAM_DIR,
            "--login-cmd", $env:LAUNCHER_LOGIN_CMD,
            "--out", "target/journey-out/${{ matrix.file }}")
          foreach ($e in $ends) { $launch += @("--end-cmd", $e) }
          node @launch
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-${{ matrix.label }}
          path: target/journey-out/${{ matrix.file }}
          if-no-files-found: ignore

  journey-report:
    name: journey release report
    needs: [kiosk-idle, journey-hub, journey-ui, journey-hub-down, launcher-logout]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: journey-*
          merge-multiple: true
          path: target/journey
      - name: Check every budget; a missing result fails
        run: node scripts/journey-report.mjs --dir target/journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-report
          path: target/journey/report.md
          if-no-files-found: ignore

  kitchen-hub:
    name: kitchen, Journey 4 and the burst over the LAN (reference i3)
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Journey 4, the unplugged printer, the burst and the soak with a route out
        shell: pwsh
        env:
          ARENA_KITCHEN_OUT: ${{ github.workspace }}/target/kitchen-out/hub.json
          ARENA_KITCHEN_UNPLUGGED_OUT: ${{ github.workspace }}/target/kitchen-out/unplugged.json
          ARENA_KITCHEN_BURST_OUT: ${{ github.workspace }}/target/kitchen-out/burst.json
          ARENA_KITCHEN_SOAK_OUT: ${{ github.workspace }}/target/kitchen-out/soak-wan-up.json
          KITCHEN_SOAK_LABEL: wan-up
        run: |
          cargo test --locked --release -p arena-api --test lan the_hub_side_of_journey_4 -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release -p arena-api --test lan an_unplugged_printer -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release -p arena-api --test lan -- --ignored --nocapture --test-threads=1 five_orders_a_second five_hundred_orders
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-hub
          path: target/kitchen-out/*.json
          if-no-files-found: ignore

  kitchen-soak-down:
    name: kitchen, 500 orders with no route out
    # A network namespace with only loopback up: the Hub, the displays and the kiosks talk on it,
    # nothing leaves it. With the `soak` input the orders are spread over 8 hours.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: kitchen-soak
      - run: cargo test --locked --release -p arena-api --test lan --no-run
      - name: 500 orders New to Served, a KOT each, with the WAN down
        env:
          ARENA_KITCHEN_SOAK_OUT: ${{ github.workspace }}/target/kitchen-out/soak-wan-down.json
          KITCHEN_SOAK_LABEL: wan-down
          KITCHEN_SOAK_SPREAD_SECS: ${{ github.event_name == 'workflow_dispatch' && inputs.soak && '28800' || '0' }}
        run: |
          sudo -E env "PATH=$PATH" unshare --net -- bash -c 'ip link set lo up && cargo test --locked --release -p arena-api --test lan -- --ignored --nocapture five_hundred_orders'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-soak
          path: target/kitchen-out/*.json
          if-no-files-found: ignore

  kitchen-browsers:
    name: kitchen display on Chrome on Android and Safari on iPad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/hub exec playwright install --with-deps chromium webkit
      - name: The board, chime, mute, Undo and LAN-loss suite on each browser
        env:
          KITCHEN_DEVICES: "1"
        run: |
          status=0
          for project in android-chrome ipad-safari; do
            KITCHEN_JSON="$GITHUB_WORKSPACE/target/kitchen-out/browser-$project.json" \
              pnpm --filter @arena/hub exec playwright test -c playwright.kitchen.config.ts --project="$project" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-browsers
          path: target/kitchen-out/*.json
          if-no-files-found: ignore

  kitchen-report:
    name: kitchen report (budgets and the compatibility list)
    needs: [kitchen-hub, kitchen-soak-down, kitchen-browsers]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: kitchen-*
          merge-multiple: true
          path: target/kitchen
      - name: Check every budget; a missing result fails
        run: node scripts/kitchen-report.mjs --dir target/kitchen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-report-and-compat
          path: |
            target/kitchen/report.md
            docs/compat/kitchen-display.md
          if-no-files-found: ignore

  remote-cloud:
    name: owner remote experience, the cloud's side (Today, commands, catch-up, R2 cost, audit)
    # The full sizes of Story 8.42 against the real router and an in-memory bucket on a simulated
    # clock; the ordinary suite runs the same tests smaller. See docs/runbooks/remote-bench.md.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: remote-cloud
      - name: Today, 200 commands, the catch-up, a month of R2 PUTs
        env:
          ARENA_REMOTE_OUT: ${{ github.workspace }}/target/remote-out
          ARENA_COST_DAYS: "30"
        run: cargo test --locked --release -p arena-cloud --test remote_experience -- --nocapture
      - name: A busy month's first audit results
        env:
          ARENA_REMOTE_OUT: ${{ github.workspace }}/target/remote-out
          ARENA_AUDIT_ROWS: "150000"
        run: cargo test --locked --release -p arena-cloud --test audit_build -- --nocapture busy_month
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-cloud
          path: target/remote-out/*.json
          if-no-files-found: ignore

  remote-owner:
    name: owner app first render on the reference phone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arena/owner exec playwright install --with-deps chromium
      - name: Today's figures on the reference phone (the budget)
        env:
          OWNER_JSON: ${{ github.workspace }}/target/remote-out/first-render.json
        run: pnpm --filter @arena/owner exec playwright test --project=reference-phone
      - name: The same on a slower link, for the record
        if: always()
        continue-on-error: true
        env:
          OWNER_JSON: ${{ github.workspace }}/target/remote-out/first-render-slow.json
          OWNER_RTT_MS: "170"
          OWNER_DOWN_MBIT: "1.6"
          OWNER_UP_MBIT: "0.75"
        run: pnpm --filter @arena/owner exec playwright test --project=reference-phone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-owner
          path: target/remote-out/*.json
          if-no-files-found: ignore

  remote-report:
    name: owner remote experience report (budgets)
    needs: [remote-cloud, remote-owner]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: remote-*
          merge-multiple: true
          path: target/remote
      - name: Check every budget; a missing result fails
        run: node scripts/remote-report.mjs --dir target/remote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-report
          path: target/remote/report.md
          if-no-files-found: ignore

  restore-drill:
    name: restore drill and privacy proof (reference i3)
    # Story 9.27: the seeded branch restored from an export and from the cloud backup, the late
    # erasure, the promote after an erasure, the privacy scan of every artefact and the 1 GB export,
    # then the report. Any failed test, missed budget or missing result fails the job, which is the
    # release gate. See docs/runbooks/restore-drill.md.
    runs-on: [self-hosted, windows, reference-i3]
    timeout-minutes: 60
    env:
      ARENA_RESTORE_DRILL_OUT: ${{ github.workspace }}/target/restore-drill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Clear earlier results
        shell: pwsh
        run: Remove-Item -Recurse -Force "$env:ARENA_RESTORE_DRILL_OUT" -ErrorAction SilentlyContinue
      - name: The drill, the late erasure, the promote and the privacy scan
        run: cargo test --locked --release -p arena-replay --lib drill -- --nocapture
      - name: A player erased after the export, the key backup's re-apply
        run: cargo test --locked --release -p arena-store --lib restore
      - name: Export of the 1 GB reference database under 10 s
        run: cargo test --locked --release -p arena-store --lib export_one_gigabyte -- --ignored --nocapture
      - name: Check every result; a missing one fails
        if: ${{ always() }}
        run: node scripts/restore-drill-report.mjs --dir target/restore-drill
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-drill-report
          path: |
            target/restore-drill/*.json
            target/restore-drill/report.md
          if-no-files-found: ignore

  soak:
    name: wan-down soak (8 h)
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    # 8 h of flows plus the build: GitHub-hosted jobs stop at 6 h, so this runs on a
    # self-hosted Linux runner (passwordless sudo, iptables, curl).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: wan-down
      - run: pnpm install --frozen-lockfile
      - run: scripts/wan-down/soak.sh --hours 8
      - name: Upload the soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-down-soak-logs
          path: target/wan-down/soak/
          retention-days: 14
