[workspace]
members = ["crates/*", "apps/*/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
arena-proto = { path = "crates/arena-proto" }
arena-store = { path = "crates/arena-store" }
arena-core = { path = "crates/arena-core" }
arena-api = { path = "crates/arena-api" }
arena-tasks = { path = "crates/arena-tasks" }
arena-replay = { path = "crates/arena-replay" }
arena-cloud = { path = "crates/arena-cloud" }
arena-kiosk-core = { path = "crates/arena-kiosk-core" }

# Pinned third-party versions (see README pin table)
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-updater = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = "=12.0.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "=0.8.9"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
ulid = "=3.0.0"
rmp-serde = "=1.3.1"
chrono-tz = "=0.10.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
argon2 = "=0.6.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# Windows-only (arena-kiosk-svc, arena-kiosk-ui): DPAPI, ACLs, pipe peers, WTS session launch,
# job objects, the service host; the lockdown (local accounts, profiles, hives), the keyboard
# hook and the monitor layout; process enforcement (WMI process-start events, Authenticode
# with catalogs, process snapshots).
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-service = "=0.8.1"

# Dev-only
tempfile = "=3.27.0"
tower = "=0.5.3"
proptest = "=1.12.0"

# argon2id is unusably slow unoptimised; tests and dev builds verify device tokens with it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
