[workspace]
members = ["crates/*", "apps/*/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
arena-proto = { path = "crates/arena-proto" }
arena-store = { path = "crates/arena-store" }
arena-core = { path = "crates/arena-core" }
arena-api = { path = "crates/arena-api" }
arena-tasks = { path = "crates/arena-tasks" }
arena-replay = { path = "crates/arena-replay" }
arena-cloud = { path = "crates/arena-cloud" }
arena-kiosk-core = { path = "crates/arena-kiosk-core" }

# Pinned third-party versions (see README pin table)
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-updater = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = "=12.0.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "=0.8.9"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
ulid = "=3.0.0"
rmp-serde = "=1.3.1"
chrono-tz = "=0.10.4"

# Dev-only
tempfile = "=3.27.0"
tower = "=0.5.3"
