[workspace]
members = ["crates/*", "apps/*/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
arena-proto = { path = "crates/arena-proto" }
arena-store = { path = "crates/arena-store" }
arena-core = { path = "crates/arena-core" }
arena-api = { path = "crates/arena-api" }
arena-tasks = { path = "crates/arena-tasks" }
arena-replay = { path = "crates/arena-replay" }
arena-cloud = { path = "crates/arena-cloud" }
arena-kiosk-core = { path = "crates/arena-kiosk-core" }

# Pinned third-party versions (see README pin table)
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-updater = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = "=12.0.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "=0.8.9"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
ulid = "=3.0.0"
rmp-serde = "=1.3.1"
chrono-tz = "=0.10.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
argon2 = "=0.6.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# gz_control on Turso (arena-store feature `control` only): remote (Hrana over HTTP) + TLS, no C
# SQLite core.
libsql = { version = "=0.10.0", default-features = false, features = ["remote", "tls"] }
# The HTTP(S) connector handed to libsql: Mozilla roots (webpki-roots) instead of libsql's
# default platform-store loader, which panics where the store cannot be read. Same majors as
# libsql 0.10 uses internally.
hyper-rustls = { version = "=0.25.0", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper = { version = "=0.14.32", default-features = false, features = ["client", "http1", "tcp"] }
# arena-cloud's `/v1` JSON extractor reads the offending field from axum's JSON rejection. The
# same version axum's `json` feature already uses.
serde_path_to_error = "=0.1.20"
# arena-cloud's nightly gz_control backup (Story 2.3). S3 against Cloudflare R2 (MinIO in dev/CI)
# with the smithy HTTPS client on rustls + ring (no aws-lc-rs); static credentials, so no
# aws-config. age encrypts to X25519 recipients (format-compatible with the age 1.3.2 CLI).
# reqwest posts the failure alert, on the workspace rustls + ring with webpki-roots.
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "=1.5.1", default-features = false, features = ["rustls-ring"] }
age = { version = "=0.12.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
# arena-cloud owner sign-up (Story 2.4): HMAC-SHA256 of one-time codes (the digest 0.10 line of
# the workspace sha2) and codes/tokens from the OS CSPRNG.
hmac = "=0.12.1"
getrandom = "=0.3.4"
# arena-cloud owner MFA (Story 2.5): TOTP's HMAC-SHA1, the secret's AES-256-GCM and its random
# bytes from ring (already in the tree through rustls); the otpauth QR rendered as SVG only (no
# image crate).
ring = "=0.17.14"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
libc = "=0.2.191"
mdns-sd = { version = "=0.21.6", default-features = false, features = ["async"] }
if-addrs = "=0.15.0"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
base64 = "=0.22.1"
# Windows-only (arena-kiosk-svc, arena-kiosk-ui): DPAPI, ACLs, pipe peers, WTS session launch,
# job objects, the service host; the lockdown (local accounts, profiles, hives), the keyboard
# hook and the monitor layout; process enforcement (WMI process-start events, Authenticode
# with catalogs, process snapshots). arena-tasks: the Hub's receipt printer through the spooler.
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-service = "=0.8.1"

# Dev-only
tempfile = "=3.27.0"
tower = "=0.5.3"
proptest = "=1.12.0"

# argon2id is unusably slow unoptimised; tests and dev builds verify device tokens with it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
