[package]
name = "arena-kiosk-ui"
description = "Arena 360 Kiosk UI (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
arena-kiosk-core.workspace = true
arena-proto.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
# WebView2 COM settings (disable context menu, accelerator keys, devtools, status bar). The
# version Tauri already resolves; not a workspace pin, so no README row.
webview2-com = "=0.39.1"
