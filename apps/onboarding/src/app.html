<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Before first paint: the theme remembered by ThemeToggle (`arena.theme`, see
      // @arena/ui theme.js), System following prefers-color-scheme.
      (function () {
        var choice = "system";
        try {
          choice = localStorage.getItem("arena.theme") || "system";
        } catch (e) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
