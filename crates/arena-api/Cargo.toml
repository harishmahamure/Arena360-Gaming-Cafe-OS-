[package]
name = "arena-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arena-core.workspace = true
arena-store.workspace = true
arena-proto.workspace = true
axum.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["net", "fs", "io-util"] }
serde_json.workspace = true
sha2.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rcgen.workspace = true
tracing.workspace = true
ulid.workspace = true

[features]
# Dev-only loopback endpoints (`POST /dev/revoke-device`). Never enabled in release builds.
dev-fixtures = []

[dev-dependencies]
arena-core = { workspace = true, features = ["test-jobs"] }
arena-kiosk-core.workspace = true
arena-tasks.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
tower.workspace = true
arena-proto = { workspace = true, features = ["dev-keys"] }
