[package]
name = "arena-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "arena-cloud"
path = "src/main.rs"

[dependencies]
arena-proto.workspace = true
arena-replay.workspace = true
arena-store = { workspace = true, features = ["control"] }
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
futures-util.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-http-client.workspace = true
age.workspace = true
reqwest = { workspace = true, features = ["form"] }
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
ulid.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
chrono.workspace = true
argon2.workspace = true
ring.workspace = true
qrcode.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
p256.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true

[dev-dependencies]
arena-proto = { workspace = true, features = ["dev-keys"] }
rusqlite.workspace = true
tower.workspace = true
tempfile.workspace = true
libsql.workspace = true
hyper.workspace = true
tokio = { workspace = true, features = ["test-util"] }
