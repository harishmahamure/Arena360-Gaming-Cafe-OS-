[package]
name = "arena-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arena-api.workspace = true
arena-tasks.workspace = true
arena-core.workspace = true
arena-store.workspace = true
arena-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Dev-only fixtures (`arena-hub dev seed`, `dev revoke-device` and the loopback
# `POST /dev/revoke-device`). Never enabled in release builds.
dev-fixtures = ["dep:ulid", "dep:serde_json", "arena-api/dev-fixtures", "arena-proto/dev-keys"]

[dev-dependencies]
tempfile.workspace = true
arena-cloud.workspace = true
arena-store = { workspace = true, features = ["control"] }
axum.workspace = true
ulid.workspace = true
arena-kiosk-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
