[package]
name = "arena-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arena-core.workspace = true
arena-store.workspace = true
arena-proto.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "fs", "process"] }
tracing.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
mdns-sd.workspace = true
if-addrs.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
zstd.workspace = true
arena-proto = { workspace = true, features = ["dev-keys"] }
arena-replay.workspace = true
arena-core = { workspace = true, features = ["test-jobs"] }
tempfile.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }
