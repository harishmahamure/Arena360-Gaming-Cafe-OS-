# Local stand-in for Cloudflare R2: MinIO for `arena-cloud --role all --dev` (Story 2.2).
#
#   docker compose -f deploy/dev/compose.yaml up -d
#
# S3 API on http://127.0.0.1:9000, bucket `arena-dev`.
# DEV-ONLY credentials (never used anywhere else): user `arena-dev`, password
# `arena-dev-password`. Loopback only. No arena-cloud code reads R2 yet; the first R2 story
# consumes this.
#
# The upstream minio/minio and minio/mc images are no longer published on Docker Hub, so this
# uses Bitnami's frozen legacy builds, pinned by tag (README pin table).

name: arena-dev

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: arena-dev
      MINIO_ROOT_PASSWORD: arena-dev-password
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot: creates the `arena-dev` bucket (idempotent) once MinIO is healthy, then exits.
  create-bucket:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 arena-dev arena-dev-password &&
        mc mb --ignore-existing local/arena-dev
    restart: "no"

volumes:
  minio-data:
