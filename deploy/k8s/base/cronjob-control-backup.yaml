# Nightly gz_control backup (Story 2.3): `arena-cloud --role jobs --task control-backup` dumps
# gz_control, age-encrypts it to the public keys in ARENA_BACKUP_AGE_RECIPIENTS (the private
# key never enters the cluster) and puts it in this environment's own R2 backup bucket, keeping
# the newest 30. A failure exits 1 and POSTs ARENA_ALERT_WEBHOOK_URL. Same image and security
# context as the control Deployment; overlays set the bucket.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arena-cloud-control-backup
  labels:
    app.kubernetes.io/name: arena-cloud-control-backup
    app.kubernetes.io/component: jobs
spec:
  schedule: "30 2 * * *"
  timeZone: Asia/Kolkata
  # Never two at once; a slot missed by up to an hour (node restart) still runs.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # One attempt per night (each failed attempt alerts; a retry could not finish inside the
      # deadline anyway); the next night still runs.
      backoffLimit: 0
      # A hung run is killed long before the next night's slot (the binary itself gives up and
      # alerts after 25 minutes). A kill, OOM or image pull failure never reaches the binary:
      # the heartbeat monitor (ARENA_BACKUP_HEARTBEAT_URL) catches those.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arena-cloud-control-backup
            app.kubernetes.io/component: jobs
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: control-backup
              image: ghcr.io/arena360/arena-cloud:unset
              imagePullPolicy: IfNotPresent
              args: ["--role", "jobs", "--task", "control-backup"]
              env:
                # The namespace is the environment name the alert carries.
                - name: ARENA_ENV
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # Per environment (overlay patch); a separate bucket from any data bucket.
                - name: ARENA_BACKUP_S3_BUCKET
                  value: BUCKET
                - name: ARENA_CONTROL_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_CONTROL_DB_URL
                - name: ARENA_CONTROL_DB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_CONTROL_DB_TOKEN
                - name: ARENA_BACKUP_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-backup
                      key: ARENA_BACKUP_S3_ENDPOINT
                - name: ARENA_BACKUP_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-backup
                      key: ARENA_BACKUP_S3_ACCESS_KEY_ID
                - name: ARENA_BACKUP_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-backup
                      key: ARENA_BACKUP_S3_SECRET_ACCESS_KEY
                - name: ARENA_BACKUP_AGE_RECIPIENTS
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-backup
                      key: ARENA_BACKUP_AGE_RECIPIENTS
                # Optional: a missing key must not block the pod (CreateContainerConfigError).
                - name: ARENA_ALERT_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-backup
                      key: ARENA_ALERT_WEBHOOK_URL
                      optional: true
                - name: ARENA_BACKUP_HEARTBEAT_URL
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-backup
                      key: ARENA_BACKUP_HEARTBEAT_URL
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                # The dump and its ciphertext are both held in memory.
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
