# Offline watch (Story 8.35): `arena-cloud --role jobs --task offline-watch` every 5 minutes raises
# the owner alerts `branch_offline` and `branch_not_uploading` (once per episode) and the push-only
# `branch_online` for paid branches that are silent while they should be open. It raises through
# the same AuthState as the control role, so it needs the same sign-up, messaging and licence
# environment; the web origins are the base value (the job serves no HTTP). When too many branches
# would alert at once it holds them all and POSTs ARENA_ALERT_WEBHOOK_URL. A failure exits 1 and
# POSTs the same webhook. Same image and security context as the other jobs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arena-cloud-offline-watch
  labels:
    app.kubernetes.io/name: arena-cloud-offline-watch
    app.kubernetes.io/component: jobs
spec:
  schedule: "*/5 * * * *"
  # Never two at once; a slot missed by a few minutes still runs.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The next slot is the retry.
      backoffLimit: 0
      # The binary gives up after 240 s; a hung pod is killed before the next slot piles up.
      activeDeadlineSeconds: 250
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arena-cloud-offline-watch
            app.kubernetes.io/component: jobs
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: offline-watch
              image: ghcr.io/arena360/arena-cloud:unset
              imagePullPolicy: IfNotPresent
              args: ["--role", "jobs", "--task", "offline-watch"]
              env:
                - name: ARENA_ENV
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: ARENA_CONTROL_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_CONTROL_DB_URL
                - name: ARENA_CONTROL_DB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_CONTROL_DB_TOKEN
                - name: ARENA_OTP_PEPPER
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_OTP_PEPPER
                - name: ARENA_GUPSHUP_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_GUPSHUP_ENDPOINT
                - name: ARENA_GUPSHUP_USERID
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_GUPSHUP_USERID
                - name: ARENA_GUPSHUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_GUPSHUP_PASSWORD
                - name: ARENA_GUPSHUP_SENDER
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_GUPSHUP_SENDER
                - name: ARENA_GUPSHUP_DLT_TEMPLATE_ID
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_GUPSHUP_DLT_TEMPLATE_ID
                - name: ARENA_MFA_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_MFA_KEY
                - name: ARENA_LICENCE_SIGNING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_LICENCE_SIGNING_KEY
                - name: ARENA_LICENCE_KID
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-secrets
                      key: ARENA_LICENCE_KID
                - name: ARENA_SMS_PROVIDER
                  value: gupshup
                - name: ARENA_WEB_ORIGINS
                  value: https://start.arena360.cloud
                # Optional: a missing key must not block the pod (CreateContainerConfigError).
                - name: ARENA_ALERT_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: arena-cloud-backup
                      key: ARENA_ALERT_WEBHOOK_URL
                      optional: true
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
