apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena-cloud-control
  labels:
    app.kubernetes.io/name: arena-cloud-control
    app.kubernetes.io/component: control
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arena-cloud-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arena-cloud-control
        app.kubernetes.io/component: control
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        # Story 8.37: built audit months unpacked for searches; the service keeps it under 50 GiB.
        - name: audit-cache
          emptyDir:
            sizeLimit: 60Gi
      containers:
        - name: control
          image: ghcr.io/arena360/arena-cloud:unset
          imagePullPolicy: IfNotPresent
          args: ["--role", "control"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ARENA_CONTROL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_CONTROL_DB_URL
            - name: ARENA_CONTROL_DB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_CONTROL_DB_TOKEN
            # Owner sign-up (Story 2.4): the OTP pepper and the Gupshup account are secrets;
            # the provider and the web origins are plain values (the origins per overlay).
            - name: ARENA_OTP_PEPPER
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_OTP_PEPPER
            - name: ARENA_GUPSHUP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_GUPSHUP_ENDPOINT
            - name: ARENA_GUPSHUP_USERID
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_GUPSHUP_USERID
            - name: ARENA_GUPSHUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_GUPSHUP_PASSWORD
            - name: ARENA_GUPSHUP_SENDER
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_GUPSHUP_SENDER
            - name: ARENA_GUPSHUP_DLT_TEMPLATE_ID
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_GUPSHUP_DLT_TEMPLATE_ID
            - name: ARENA_MFA_KEY
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_MFA_KEY
            - name: ARENA_LICENCE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_LICENCE_SIGNING_KEY
            - name: ARENA_LICENCE_KID
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_LICENCE_KID
            - name: ARENA_SMS_PROVIDER
              value: gupshup
            - name: ARENA_WEB_ORIGINS
              value: https://start.arena360.cloud
            - name: ARENA_AUDIT_CACHE_DIR
              value: /audit-cache
            # Story 8.37: Arena 360 staff credentials for /v1/admin/* (<staff-id>:<sha256 hex>,...).
            # Without them that API answers 404.
            - name: ARENA_ADMIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-secrets
                  key: ARENA_ADMIN_TOKENS
                  optional: true
            # Story 8.37: audit searches read built months from the data bucket (see the builder).
            - name: ARENA_DATA_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-data
                  key: ARENA_DATA_S3_ENDPOINT
                  optional: true
            - name: ARENA_DATA_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-data
                  key: ARENA_DATA_S3_BUCKET
                  optional: true
            - name: ARENA_DATA_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-data
                  key: ARENA_DATA_S3_ACCESS_KEY_ID
                  optional: true
            - name: ARENA_DATA_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: arena-cloud-data
                  key: ARENA_DATA_S3_SECRET_ACCESS_KEY
                  optional: true
          volumeMounts:
            - name: audit-cache
              mountPath: /audit-cache
          # /healthz always answers 200 from a cached gz_control check, so a Turso blip never
          # restarts the pod; readiness uses the same path.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Start-up may retry gz_control for up to 60 s before exiting.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          # Keep serving while the endpoint is removed from Traefik, so a rollout drops no
          # requests. The native sleep action: distroless has no shell for `exec: sleep`.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
