# arena-cloud base: the control role, its Service, the Traefik Ingress and the Cloudflare-only
# origin lock. Overlays set the namespace, host, replicas, resources and image tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: arena-cloud
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - middleware-cloudflare-only.yaml
