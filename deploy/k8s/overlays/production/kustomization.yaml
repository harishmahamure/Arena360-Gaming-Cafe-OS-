# arena-cloud in `production` at api.arena360.cloud. The deploy workflow replaces the image tag with the
# commit SHA it built.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
images:
  - name: ghcr.io/arena360/arena-cloud
    newTag: production
patches:
  - target:
      kind: Ingress
      name: arena-cloud
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: production-cloudflare-only@kubernetescrd
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.arena360.cloud
      - op: replace
        path: /spec/rules/0/host
        value: api.arena360.cloud
  - target:
      kind: Deployment
      name: arena-cloud-control
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
  # This environment's onboarding origin, merged into the env list by name.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: arena-cloud-control
      spec:
        template:
          spec:
            containers:
              - name: control
                env:
                  - name: ARENA_WEB_ORIGINS
                    value: https://start.arena360.cloud
  - target:
      kind: CronJob
      name: arena-cloud-control-backup
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/1/value
        value: arena360-gz-control-backup-production
